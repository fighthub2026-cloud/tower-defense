<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pinguins vs. Gosmas</title>
    <link rel="stylesheet" href="/src/ui/style.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <strong>PINGUINS <span>vs.</span> GOSMAS</strong
          ><small>Vale Congelado · Laboratório de combate</small>
        </div>
        <div class="controls">
          <button id="pause">Pausar</button><button id="speed">1×</button
          ><button id="export">Exportar sprites</button
          ><button id="reset">Reiniciar</button
          ><button id="sound" aria-pressed="false">Som: desligado</button>
        </div>
      </header>
      <canvas id="game" aria-label="Mapa de defesa da colônia"></canvas>
      <footer>
        <span id="hint"
          >Selecione um pinguim na lateral e clique na neve. Esc cancela.</span
        ><span id="status">Carregando sprites…</span>
      </footer>
      <p id="error" hidden></p>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
